<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"
        integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>

    <div class="container mt-4 p-5 shadow rounded-3" id="container">
        <a href="formAdd.html" class="btn btn-primary float-end">+Add Student</a>
        <table class="table text-center table-hover">
            <thead>
                <th>ID</th>
                <th>Name</th>
                <th>Gender</th>
                <th>Age</th>
                <th>Email</th>
                <th>Actions</th>
            </thead>
            <tbody id="tbody">

            </tbody>
        </table>
    </div>

</body>

</html>

<script>
    $(document).ready(function () {
        $.ajax({
            url: 'http://localhost:3000/student',
            success: function (data) {
                data.forEach((value, index) => {
                    $('#tbody').append(`
                        <tr id="${value.id}">
                            <td>${index+1}</td>
                            <td>${value.name}</td>
                            <td>${value.gender}</td>
                            <td>${value.age}</td>
                            <td>${value.email}</td>
                            <td>    

                                <a href="formEdit.html?id=${value.id}" class="btn btn-warning" >Edit</a>
                                <button class="btn btn-danger ms-2" onclick = "btnDelete('${value.id}')">${"Delete"}</button>
                            </td>
                        </tr>
                    `)
                })
            }
        })
        
    })

    function btnDelete(id){
            if (!confirm("Are You Sure?")) return
            $.ajax({
                url: `http://localhost:3000/student/${id}`,
                method: 'DELETE',
                success: function (){
                    $(`#${id}`).remove()
                }
            })
        }

</script>
