<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"
        integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body class="p-4">

    <a href="index.html" class="btn btn-primary">Back to List</a>
    <div class="container mt-4 p-5 shadow rounded-3 w-50" id="container">
        <h2 class="text-center mb-3">Edit Student</h2>
        <form action="">
            <input type="hidden" name="" id="id">
            <div class="mb-2">
                <label for="" class="form-label">Name</label>
                <input type="text" class="form-control" name="" id="name" placeholder="Noy Vanneth">
            </div>
            <div class="mb-2">
                <label for="" class="form-label">Gender</label>
                <select name="" id="gender" class="form-select">
                    <option value="" disabled selected>--other--</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
            <div class="mb-2">
                <label for="" class="form-label">Email</label>
                <input type="email" class="form-control" name="" id="email" placeholder="N.Vanneth@gmail.com">
            </div>
            <div class="mb-4">
                <label for="" class="form-label">Age</label>
                <input type="number" class="form-control" step="1" name="" id="age" placeholder="67">
            </div>
            <button type="button" class="btn btn-success d-flex mx-auto" id="btnEdit">Add</button>
        </form>
    </div>

</body>

</html>

<script>

    $(document).ready(function () {
        const param = new URLSearchParams(window.location.search)
        const id = param.get("id")
        console.log(id);

        $.ajax({
            url: `http://localhost:3000/student/${id}`,
            success: function (data) {
                console.log(data);
                $('#id').val(id)
                $('#name').val(data.name)
                $('#email').val(data.email)
                $('#gender').val(data.gender)
                $('#age').val(data.age)

            }
        })
        $('#btnEdit').click(function () {
            const id = $('#id').val()
            const name = $('#name').val()
            const gender = $('#gender').val()
            const email = $('#email').val()
            const age = $('#age').val()
            let data = {
                name: name,
                gender: gender,
                email: email,
                age: age
            }
            $.ajax({
                url: `http://localhost:3000/student/${id}`,
                method: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function () {
                    window.location.href = "index.html"
                }
            })
        })

    })

</script>
